# Email Manager — إعداد الإنتاج (Dockge/السيرفر) مع PostgreSQL
# يسحب صورة التطبيق الجاهزة من GHCR — لا حاجة لبناء محلي على السيرفر.
# التشغيل على السيرفر:  docker compose pull && docker compose up -d
# افتح المتصفح على:  http://localhost:8000   (المدير الافتراضي: admin / admin)
#
# للتطوير المحلي (بناء app.py من جهازك + إعادة تحميل تلقائي) يوجد
# docker-compose.override.yml الذي يُدمج تلقائياً ويضيف build و bind لـ app.py.
services:
  db:
    image: postgres:16
    container_name: email-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: emailmanager
      POSTGRES_USER: emailmgr
      POSTGRES_PASSWORD: "EmailMgr#2026"
      TZ: "Asia/Riyadh"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailmgr -d emailmanager"]
      interval: 5s
      timeout: 5s
      retries: 20

  email-manager:
    # صورة الإنتاج الجاهزة من GitHub Container Registry (تُبنى تلقائياً عبر GitHub Actions).
    image: ghcr.io/wifieg/e-mail:latest
    container_name: email-manager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"     # واجهة الويب
      - "8025:8025"     # SMTP الداخلي المدمج
      - "8143:8143"     # IMAP الداخلي المدمج
    volumes:
      # نحتفظ بـ SQLite القديمة للنقل التلقائي أول مرة (تُقرأ ثم تُهجَر لصالح Postgres).
      - emaildata:/app/data
      # نفس volume النسخ الاحتياطي المشترك مع خدمة db-backup (للتحميل/النسخ الفوري).
      - pgbackups:/app/backups
    environment:
      EM_HOST: "0.0.0.0"
      EM_PORT: "8000"
      EM_NO_BROWSER: "1"
      EM_DB: "/app/data/email_manager.db"
      # قاعدة البيانات الأساسية = PostgreSQL
      EM_PG: "postgresql://emailmgr:EmailMgr%232026@db:5432/emailmanager"
      EM_INT_SMTP_PORT: "8025"
      EM_INT_IMAP_PORT: "8143"
      EM_BACKUP_DIR: "/app/backups"
      EM_BACKUP_KEEP: "14"
      TZ: "Asia/Riyadh"   # توقيت السعودية (UTC+3)

  # نسخ احتياطي تلقائي يومي لقاعدة Postgres — يحتفظ بآخر 14 نسخة داخل volume مستقل.
  db-backup:
    image: postgres:16
    container_name: email-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "EmailMgr#2026"
      TZ: "Asia/Riyadh"
    volumes:
      - pgbackups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "db-backup: started (daily, keep 14)";
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S);
          OUT="/backups/emailmanager_$${TS}.dump";
          if pg_dump -h db -U emailmgr -d emailmanager -F c -f "$$OUT"; then
            echo "db-backup: ok $$OUT";
          else
            echo "db-backup: FAILED $$OUT"; rm -f "$$OUT";
          fi;
          ls -1t /backups/emailmanager_*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f;
          sleep 86400;
        done

volumes:
  emaildata:
  pgdata:
  pgbackups:
