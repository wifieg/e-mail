# Email Manager — تشغيل جاهز
# التشغيل:  docker compose up -d --build
# افتح المتصفح على:  http://localhost:8000   (المدير الافتراضي: admin / admin)
services:
  email-manager:
    build: .
    image: email-manager:latest
    container_name: email-manager
    restart: unless-stopped
    ports:
      - "8000:8000"     # واجهة الويب
      - "8025:8025"     # SMTP الداخلي المدمج
      - "8143:8143"     # IMAP الداخلي المدمج
    volumes:
      # قاعدة البيانات + المفاتيح على Docker volume (نظام ملفات أصلي — موثوق وسريع).
      # البيانات تبقى محفوظة بين عمليات التشغيل ولا تُمسح عند تحديث الصورة.
      - emaildata:/app/data
    environment:
      EM_HOST: "0.0.0.0"
      EM_PORT: "8000"
      EM_NO_BROWSER: "1"
      EM_DB: "/app/data/email_manager.db"
      EM_INT_SMTP_PORT: "8025"
      EM_INT_IMAP_PORT: "8143"
      EM_WAL: "1"       # WAL — أداء وتزامن أفضل على نظام الملفات الأصلي
      TZ: "Asia/Riyadh" # توقيت السعودية (UTC+3)

volumes:
  emaildata:
